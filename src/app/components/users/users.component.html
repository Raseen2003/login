<div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead class="bg-light">
      <tr>
        <th class="ps-4 py-3 text-secondary small fw-semibold text-uppercase">Member</th>
        <th class="py-3 text-secondary small fw-semibold text-uppercase">Contact Info</th>
        <th class="py-3 text-secondary small fw-semibold text-uppercase">Location</th>
        <th class="py-3 text-secondary small fw-semibold text-uppercase">Email</th>
        <th *ngIf="userRole() === 'admin'" class="py-3 text-secondary small fw-semibold text-uppercase text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of userList()">
        <td class="ps-4 py-3">
          <div class="d-flex align-items-center">
            <div class="rounded-circle bg-warning bg-opacity-10 text-dark d-flex align-items-center justify-content-center fw-bold me-3" 
                 style="width: 40px; height: 40px;">
              {{ user.name ? user.name.charAt(0).toUpperCase() : 'U' }}
            </div>
            <div>
              <div class="fw-semibold text-dark">{{ user.name }}</div>
              <div class="small text-muted text-capitalize">{{ user.role }}</div>
            </div>
          </div>
        </td>

        <td class="py-3 text-dark">
          <i class="bi bi-telephone text-muted me-2"></i>{{ user.phoneno || 'Not Set' }}
        </td>

        <td class="py-3">
          <span class="badge rounded-pill bg-secondary bg-opacity-10 text-secondary border-0 px-3">
            {{ user.address || 'No Address' }}
          </span>
        </td>

        <td class="py-3 text-dark">
          {{ user.email }}
        </td>

        <td *ngIf="userRole() === 'admin'" class="py-3 text-center">
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-outline-primary btn-sm rounded-2 px-3" (click)="onEdit(user)" 
                    data-bs-toggle="modal" data-bs-target="#editUserModal">
              <i class="bi bi-pencil me-1"></i> Edit
            </button>
            <button class="btn btn-outline-danger btn-sm rounded-2 px-3" (click)="onDelete(user._id)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </td>
      </tr>

      <tr *ngIf="userList().length === 0">
        <td colspan="5" class="text-center py-5 bg-light bg-opacity-25">
          <div class="text-muted">
            <i class="bi bi-inbox display-6 d-block mb-2"></i>
            <span>No registered users found in the system.</span>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-edit-user-form (userUpdated)="loadUsers()"></app-edit-user-form>

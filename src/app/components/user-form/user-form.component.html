<div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header bg-warning text-white">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-person-plus-fill me-2"></i> Create New User
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="modal-body p-4">

          <div class="alert alert-info border-0 small mb-4 py-2">
            <i class="bi bi-info-circle me-1"></i>
            Only basic details needed now. Phone, address and photo can be added later via <strong>Edit</strong>.
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" class="form-control" formControlName="name"
                   placeholder="Letters only, max 15" maxlength="15"
                   (keydown)="blockNumbers($event)"
                   [class.is-invalid]="userForm.get('name')?.invalid && userForm.get('name')?.touched">
            <div class="invalid-feedback">
              <span *ngIf="userForm.get('name')?.errors?.['required']">Name is required.</span>
              <span *ngIf="userForm.get('name')?.errors?.['pattern']">Only letters allowed.</span>
              <span *ngIf="userForm.get('name')?.errors?.['maxlength']">Max 15 characters.</span>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Email Address</label>
            <input type="email" class="form-control" formControlName="email"
                   placeholder="user@example.com"
                   [class.is-invalid]="userForm.get('email')?.invalid && userForm.get('email')?.touched">
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Password</label>
            <div class="input-group">
              <input [type]="showPassword() ? 'text' : 'password'" class="form-control"
                     formControlName="password" placeholder="Min 6 characters"
                     (keydown)="blockSpaces($event)"
                     [class.is-invalid]="userForm.get('password')?.invalid && userForm.get('password')?.touched">
              <button class="btn btn-outline-secondary" type="button" (click)="togglePassword()">
                <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Role</label>
            <select class="form-select" formControlName="role">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>

        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-warning px-4" [disabled]="userForm.invalid">
            <i class="bi bi-person-check-fill me-1"></i> Create User
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="addUserModalLabel text-primary">Add New User</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="modal-body">
          
          <div class="mb-3">
            <label class="col-form-label fw-bold">Name:</label>
            <input type="text" class="form-control" formControlName="username" placeholder="Enter Name"
                   [class.is-invalid]="userForm.get('username')?.invalid && userForm.get('username')?.touched">
            <div class="invalid-feedback">Only letters allowed, no numbers.</div>
          </div>

          <div class="mb-3">
            <label class="col-form-label fw-bold">Email:</label>
            <input type="email" class="form-control" formControlName="email" placeholder="Enter email" (keydown)="blockSpaces($event)"
                   [class.is-invalid]="userForm.get('email')?.invalid && userForm.get('email')?.touched">
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>

          <div class="mb-3">
            <label class="col-form-label fw-bold">Phone Number:</label>
            <input type="tel" class="form-control" formControlName="phoneno" placeholder="10-digit number" (keydown)="onlyNumbers($event)"
                   [class.is-invalid]="userForm.get('phoneno')?.invalid && userForm.get('phoneno')?.touched">
            <div class="invalid-feedback">Must be exactly 10 digits.</div>
          </div>

          <div class="mb-3">
            <label class="col-form-label fw-bold">Address:</label>
            <input type="text" class="form-control" formControlName="address" placeholder="Enter address">
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-warning" [disabled]="userForm.invalid">Save Changes</button>
        </div>
      </form>

    </div>
  </div>
</div>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">TechWyse Login</h3>
      <p class="text-muted small">Please enter your credentials</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <input type="email" class="form-control" formControlName="email" 
               placeholder="name@example.com" 
               (keydown)="blockSpaces($event)"
               [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control" formControlName="password" 
               placeholder="Enter your password" 
               (keydown)="blockSpaces($event)"
               [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
               required>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a routerLink="/forgot-password" class="text-decoration-none small fw-bold text-primary">
          Forgot Password?
        </a>
      </div>

      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary btn-lg" [disabled]="loginForm.invalid">
          Login
        </button>
      </div>

    </form>
    
    <div class="text-center mt-3">
      <span class="text-muted small">Don't have an account? </span>
      <a routerLink="/register" class="text-decoration-none small fw-bold text-primary">
        Sign Up
      </a>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      
      <div class="text-center mb-4">
        <div class="display-4 text-primary mb-2">
          <i class="bi bi-shield-lock"></i> </div>
        <h3 class="fw-bold">Forgot Password?</h3>
        <p class="text-muted small">No worries! Enter your email and we'll send you a reset link.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
  <div class="mb-3">
    <label for="emailInput" class="form-label fw-semibold">Email Address</label>
    <input 
      type="email" 
      class="form-control" 
      name="email"
      [ngModel]="email()" 
      (ngModelChange)="email.set($event)"
      placeholder="name@example.com" 
      required>
  </div>

  <button type="submit" [disabled]="isLoading() || forgotForm.invalid" class="btn btn-primary w-100 py-2 fw-bold">
    {{ isLoading() ? 'Sending...' : 'Send Reset Link' }}
  </button>

  @if (message()) {
    <div class="alert alert-success mt-3 small">
      {{ message() }}
    </div>
  }
</form>
      <div class="text-center mt-4">
        <a href="/login" class="text-decoration-none small text-secondary">
          <i class="bi bi-arrow-left"></i> Back to Login
        </a>
      </div>
      
    </div>
  </div>
</div>
